# Publica las herramientas interactivas (herramientas/html) en GitHub Pages.
name: Herramientas interactivas

on:
  push:
    branches: [main]
    paths: ["herramientas/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar las páginas
        working-directory: herramientas
        run: |
          pip install numpy scipy "bokeh>=3.6,<4"
          python3 generar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: herramientas/html
      - id: despliegue
        uses: actions/deploy-pages@v4
